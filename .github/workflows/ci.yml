name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_release.py
      - run: python -m unittest discover -s knowledge_center/tests -t . -v
      - run: python generate-survey-report/tests/smoke_test_pipeline.py
      - run: python generate-operation-analysis-report/tests/smoke_test_pipeline.py
      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: "[void][scriptblock]::Create((Get-Content -Raw install.ps1))"
      - name: Validate macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: bash -n install.sh
